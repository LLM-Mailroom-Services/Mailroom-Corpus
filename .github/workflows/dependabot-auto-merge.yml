name: Dependabot auto-merge

# Auto-merge Dependabot patch/minor PRs once required checks are green.
# Majors stay manual. Requires: Settings → General → Allow auto-merge,
# and (recommended) branch protection with required status checks.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge (squash) for patch/minor
        if: >-
          contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'),
                   steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
